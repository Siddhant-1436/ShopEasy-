<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin sign in | ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-login-page">
    <main class="admin-login-card">
        <a class="brand justify-content-center" href="{{ url_for('home') }}">
            <span class="brand-mark"><i class="bi bi-bag-heart-fill" aria-hidden="true"></i></span>
            <span>shop<span class="brand-easy">easy</span><small>.</small></span>
        </a>
        <span class="admin-login-eyebrow">SECURE WORKSPACE</span>
        <h1>Admin sign in</h1>
        <p>Use your administrator account to manage the store.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('admin_login', next=request.args.get('next', '')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="username">Admin username</label>
                <input class="form-control" id="username" name="username" maxlength="50" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign in securely</button>
        </form>
        <a class="admin-back-link" href="{{ url_for('home') }}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Return to ShopEasy</a>
    </main>
</body>
</html>
